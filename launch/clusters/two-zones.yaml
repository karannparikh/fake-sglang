# Two zones, prefill and decode split across them.
#
# Each prefill worker has a decode worker on its own node, one in another rack
# and one in the other zone. A topology-blind router picks among them by load
# alone, so roughly half the handoffs cross the slow inter-zone link; grep the
# workers' output for "over 'default' link" to count them.
#
#   ./launch/cluster.sh launch/clusters/two-zones.yaml

model: models/qwen3-0.6b          # relative to the repo, an absolute path, or an HF id
served_model_name: fake-model

frontend:
  http_port: 8000
  router_mode: kv                 # round-robin | random | kv  (kv turns on KV events)
  args: []

defaults:                         # applied to every worker
  page_size: 256
  args: []                        # e.g. [--fake-itl-ms, 12]

# A location is one path component per level, outermost first. A transfer
# crosses the link named by the deepest level both ends share:
#   node    - same node                (zone, rack and node equal)
#   rack    - same rack, other node
#   zone    - same zone, other rack
#   default - different zones
topology:
  levels: [zone, rack, node]
  links:
    node:    {bandwidth_gb_s: 450,  latency_ms: 0.01}   # NVLink-class
    rack:    {bandwidth_gb_s: 50,   latency_ms: 0.05}   # 400G RDMA
    zone:    {bandwidth_gb_s: 12.5, latency_ms: 0.5}    # 100G spine
    default: {bandwidth_gb_s: 1.25, latency_ms: 5}      # 10G inter-zone

workers:
  # role: prefill | decode | agg.  count defaults to 1.  args/env are per group.
  - {role: prefill, count: 1, location: zone-a/rack-1/node-1}
  - {role: prefill, count: 1, location: zone-b/rack-1/node-1}
  - {role: decode,  count: 1, location: zone-a/rack-1/node-1}
  - {role: decode,  count: 1, location: zone-a/rack-2/node-1}
  - {role: decode,  count: 1, location: zone-b/rack-1/node-1}
  - {role: decode,  count: 1, location: zone-b/rack-2/node-1}
